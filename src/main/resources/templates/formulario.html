<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Horizonte | Seguimiento académico</title><link rel="stylesheet" th:href="@{/estilo.css}"></head><body><header><div class="barra"><a class="marca" th:href="@{/}">Horizonte</a><nav aria-label="Principal"><a th:href="@{/proyectos}">Proyectos</a><a th:href="@{/entregables}">Entregables</a></nav></div></header><main><a th:href="@{${ruta}}">← Volver al listado</a><h1 th:text="(${editar} ? 'Editar ' : 'Registrar ') + ${#strings.toLowerCase(entidad)}"></h1><form class="panel formulario" th:action="@{${accion}}" th:object="${form}" method="post">
<div th:if="${proyectoVista}"><label for="nombre">Nombre</label><input id="nombre" th:field="*{nombre}" maxlength="120" required><p class="campo-error" th:errors="*{nombre}"></p><label for="descripcion">Descripción</label><textarea id="descripcion" th:field="*{descripcion}" maxlength="500" rows="4" required></textarea><p class="campo-error" th:errors="*{descripcion}"></p></div>
<div th:unless="${proyectoVista}"><label for="titulo">Título</label><input id="titulo" th:field="*{titulo}" maxlength="120" required><p class="campo-error" th:errors="*{titulo}"></p><label for="fecha">Fecha límite</label><input id="fecha" type="date" th:field="*{fecha}" required><p class="campo-error" th:errors="*{fecha}"></p><label for="proyectoId">Proyecto</label><select id="proyectoId" th:field="*{proyectoId}" required><option value="">Selecciona un proyecto</option><option th:each="p : ${proyectos}" th:value="${p.id}" th:text="${p.nombre}"></option></select><p class="campo-error" th:errors="*{proyectoId}"></p><p th:if="${#lists.isEmpty(proyectos)}">Para continuar, <a th:href="@{/proyectos/nuevo}">crea un proyecto</a>.</p></div>
<div class="acciones"><button type="submit">Guardar</button><a th:href="@{${ruta}}">Cancelar</a></div></form></main><footer>Horizonte · Proyecto de aula de Arquitectura de Software</footer></body></html>
