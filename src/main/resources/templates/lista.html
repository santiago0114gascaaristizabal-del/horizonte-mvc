<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Horizonte | Seguimiento académico</title><link rel="stylesheet" th:href="@{/estilo.css}"></head><body><header><div class="barra"><a class="marca" th:href="@{/}">Horizonte</a><nav aria-label="Principal"><a th:href="@{/proyectos}">Proyectos</a><a th:href="@{/entregables}">Entregables</a></nav></div></header><main><p class="aviso exito" role="status" th:if="${exito}" th:text="${exito}"></p><p class="aviso error" role="alert" th:if="${error}" th:text="${error}"></p><div class="cabecera"><div><p class="etiqueta">SEGUIMIENTO ACADÉMICO</p><h1 th:text="${plural}"></h1></div><a class="boton" th:href="@{${ruta + '/nuevo'}}" th:text="'Nuevo ' + ${#strings.toLowerCase(entidad)}"></a></div><div class="panel tabla"><table><thead><tr><th scope="col">ID</th><th scope="col" th:text="${proyectoVista ? 'Nombre' : 'Título'}"></th><th scope="col" th:unless="${proyectoVista}">Proyecto</th><th scope="col" th:unless="${proyectoVista}">Fecha límite</th><th scope="col">Acciones</th></tr></thead><tbody><tr th:each="fila : ${filas}"><td th:text="${fila.id}"></td><td th:text="${proyectoVista ? fila.nombre : fila.titulo}"></td><td th:unless="${proyectoVista}" th:text="${fila.proyecto.nombre}"></td><td th:unless="${proyectoVista}" th:text="${fila.fecha}"></td><td><a th:href="@{${ruta + '/' + fila.id}}">Consultar</a> · <a th:href="@{${ruta + '/' + fila.id + '/editar'}}">Editar</a></td></tr><tr th:if="${#lists.isEmpty(filas)}"><td th:colspan="${proyectoVista ? 3 : 5}">Aún no hay registros.</td></tr></tbody></table></div></main><footer>Horizonte · Proyecto de aula de Arquitectura de Software</footer></body></html>
