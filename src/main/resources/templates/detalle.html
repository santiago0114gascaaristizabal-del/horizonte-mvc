<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Horizonte | Seguimiento académico</title><link rel="stylesheet" th:href="@{/estilo.css}"></head><body><header><div class="barra"><a class="marca" th:href="@{/}">Horizonte</a><nav aria-label="Principal"><a th:href="@{/proyectos}">Proyectos</a><a th:href="@{/entregables}">Entregables</a></nav></div></header><main><p class="aviso exito" role="status" th:if="${exito}" th:text="${exito}"></p><p class="aviso error" role="alert" th:if="${error}" th:text="${error}"></p><a th:href="@{${ruta}}">← Volver al listado</a><p class="etiqueta" th:text="${entidad + ' · ' + registro.id}"></p><h1 th:text="${proyectoVista ? registro.nombre : registro.titulo}"></h1><section class="panel" th:if="${proyectoVista}"><h2>Descripción</h2><p class="descripcion" th:text="${registro.descripcion}"></p><h2>Entregables asociados</h2><p th:if="${#lists.isEmpty(relacionados)}">Este proyecto no tiene entregables.</p><ul><li th:each="e : ${relacionados}"><a th:href="@{/entregables/{id}(id=${e.id})}" th:text="${e.titulo}"></a> <span th:text="${e.fecha}"></span></li></ul></section><section class="panel" th:unless="${proyectoVista}"><dl><dt>Proyecto</dt><dd><a th:href="@{/proyectos/{id}(id=${registro.proyecto.id})}" th:text="${registro.proyecto.nombre}"></a></dd><dt>Fecha límite</dt><dd th:text="${registro.fecha}"></dd></dl></section><div class="acciones"><a class="boton" th:href="@{${ruta + '/' + registro.id + '/editar'}}">Editar</a><form method="post" th:action="@{${ruta + '/' + registro.id + '/eliminar'}}" onsubmit="return confirm('¿Eliminar este registro?')"><button class="borrar" type="submit">Eliminar</button></form></div></main><footer>Horizonte · Proyecto de aula de Arquitectura de Software</footer></body></html>
