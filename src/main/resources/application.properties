spring.application.name=Horizonte MVC
server.address=127.0.0.1
server.port=${HORIZONTE_PORT:8080}
spring.datasource.url=${HORIZONTE_DB_URL:jdbc:sqlserver://127.0.0.1:14333;databaseName=HorizonteMVC;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${HORIZONTE_DB_USER:}
spring.datasource.password=${HORIZONTE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-message=never
